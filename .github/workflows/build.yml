name: build-windows-exe

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Download verified official PawnIO 2.2.0 installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Resources | Out-Null
          $url = 'https://github.com/namazso/PawnIO.Setup/releases/download/2.2.0/PawnIO_setup.exe'
          $out = 'Resources/PawnIO_setup.exe'
          Invoke-WebRequest -Uri $url -OutFile $out
          $expected = '1f519a22e47187f70a1379a48ca604981c4fcf694f4e65b734aaa74a9fba3032'
          $actual = (Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "PawnIO SHA256 mismatch: $actual" }

      - name: Restore
        run: dotnet restore CPUCKTest.csproj

      - name: Publish single-file EXE
        run: dotnet publish CPUCKTest.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CPUCKTest-win-x64
          path: publish/CPUCKTest.exe
          if-no-files-found: error
