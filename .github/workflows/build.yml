name: build-windows-exe

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Download PresentMon for FPS overlay
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools | Out-Null
          $url = 'https://github.com/GameTechDev/PresentMon/releases/download/v2.5.1/PresentMon-2.5.1-x64.exe'
          Invoke-WebRequest -Uri $url -OutFile 'tools\PresentMon.exe'
          $expected = '9bec3083069f58f911e6a512f4806db51a27bd096103087bc1d05ef54c80a191'
          $actual = (Get-FileHash 'tools\PresentMon.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "PresentMon SHA256 mismatch: $actual" }
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/GameTechDev/PresentMon/main/LICENSE.txt' -OutFile 'tools\PresentMon-LICENSE.txt'

      - name: Restore
        run: dotnet restore CPUCKTest.csproj

      - name: Publish single-file EXE
        run: dotnet publish CPUCKTest.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CPUCKTest-win-x64
          path: publish/CPUCKTest.exe
          if-no-files-found: error
